<svg width="1200" height="590" viewBox="0 0 1200 590" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Starter repository layout</title>
  <desc id="description">The starter contains repository workflow policy and an e2e directory with configuration, runner files, and tests. The compose.e2e.yml file and sut directory are optional local-system examples, not action requirements. An existing remote target needs neither.</desc>
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#353535" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#28F89A"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#181818" flood-opacity="0.32"/>
    </filter>
    <style>
      .heading { font: 700 22px Inter, Geist, Arial, sans-serif; letter-spacing: 1.8px; fill: #28F89A; }
      .subtitle { font: 400 15px Inter, Geist, Arial, sans-serif; fill: #D4D4D4; }
      .label { font: 650 17px Inter, Geist, Arial, sans-serif; fill: #F6F6F6; }
      .detail { font: 400 13px Inter, Geist, Arial, sans-serif; fill: #D4D4D4; }
      .file { font: 550 12.5px 'Azeret Mono', 'SFMono-Regular', Consolas, monospace; fill: #F6F6F6; }
      .type { font: 700 11px Inter, Geist, Arial, sans-serif; fill: #181818; letter-spacing: 0.7px; }
      .connector { stroke: #28F89A; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="588" rx="24" fill="#2A2A2A" stroke="#424242" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="588" rx="24" fill="url(#grid)" opacity="0.72"/>

  <text x="50" y="53" class="heading">STARTER REPOSITORY LAYOUT</text>
  <text x="50" y="80" class="subtitle">Workflow policy and E2E files, plus optional local-system examples</text>

  <g filter="url(#shadow)">
    <rect x="425" y="108" width="350" height="68" rx="16" fill="#22332F" stroke="#28F89A" stroke-width="2"/>
    <text x="451" y="138" class="label">Your application repository</text>
    <text x="451" y="159" class="detail">created from this template</text>
  </g>

  <path d="M600 176 V218 H150 V246" class="connector"/>
  <path d="M600 176 V218 H398 V246" class="connector"/>
  <path d="M600 176 V218 H646 V246" class="connector"/>
  <path d="M600 176 V218 H972 V246" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="38" y="248" width="224" height="188" rx="16" fill="#333333" stroke="#424242" stroke-width="1.5"/>
    <rect x="58" y="268" width="82" height="22" rx="11" fill="#28F89A"/>
    <text x="72" y="283" class="type">POLICY</text>
    <text x="58" y="324" class="label">Workflow</text>
    <rect x="58" y="344" width="184" height="52" rx="9" fill="#424242"/>
    <text x="74" y="366" class="file">.github/workflows/</text>
    <text x="74" y="384" class="file">e2e.yml</text>
    <text x="58" y="418" class="detail">lifecycle · comment · gate</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="286" y="248" width="224" height="188" rx="16" fill="#333333" stroke="#424242" stroke-width="1.5"/>
    <rect x="306" y="268" width="170" height="22" rx="11" fill="#28F89A"/>
    <text x="320" y="283" class="type">OPTIONAL EXAMPLE</text>
    <text x="306" y="324" class="label">Compose</text>
    <rect x="306" y="344" width="184" height="52" rx="9" fill="#424242"/>
    <text x="322" y="375" class="file">compose.e2e.yml</text>
    <text x="306" y="418" class="detail">omit for a remote target</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="534" y="248" width="224" height="188" rx="16" fill="#333333" stroke="#424242" stroke-width="1.5"/>
    <rect x="554" y="268" width="170" height="22" rx="11" fill="#28F89A"/>
    <text x="568" y="283" class="type">OPTIONAL EXAMPLE</text>
    <text x="554" y="324" class="label">Services</text>
    <rect x="554" y="344" width="184" height="52" rx="9" fill="#424242"/>
    <text x="570" y="375" class="file">sut/</text>
    <text x="554" y="418" class="detail">omit for a remote target</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="782" y="248" width="380" height="282" rx="16" fill="#333333" stroke="#28F89A" stroke-width="1.5"/>
    <rect x="802" y="268" width="92" height="22" rx="11" fill="#28F89A"/>
    <text x="817" y="283" class="type">E2E DIR</text>
    <text x="802" y="324" class="label">Runner + tests</text>

    <rect x="802" y="344" width="160" height="42" rx="9" fill="#424242"/>
    <text x="818" y="370" class="file">ci.yml</text>
    <rect x="978" y="344" width="164" height="42" rx="9" fill="#424242"/>
    <text x="994" y="370" class="file">Dockerfile</text>

    <rect x="802" y="400" width="160" height="42" rx="9" fill="#424242"/>
    <text x="818" y="426" class="file">runner-entrypoint</text>
    <rect x="978" y="400" width="164" height="42" rx="9" fill="#424242"/>
    <text x="994" y="426" class="file">playwright.config</text>

    <rect x="802" y="456" width="340" height="52" rx="9" fill="#22332F" stroke="#28F89A"/>
    <text x="818" y="478" class="file">tests/</text>
    <text x="818" y="497" class="detail">replace examples with your suites</text>
  </g>

  <text x="50" y="559" class="subtitle">The action consumes e2e/; Compose and sut/ are optional starter examples, not action requirements.</text>
</svg>
