<svg width="1200" height="590" viewBox="0 0 1200 590" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Starter repository E2E flow</title>
  <desc id="description">A change activates repository workflow policy, invokes the portable E2E action, runs a Dockerized system against the Playwright runner, publishes results, and enforces the E2E gate.</desc>
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#353535" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#28F89A"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#181818" flood-opacity="0.32"/>
    </filter>
    <style>
      .heading { font: 700 22px Inter, Geist, Arial, sans-serif; letter-spacing: 1.8px; fill: #28F89A; }
      .subtitle { font: 400 15px Inter, Geist, Arial, sans-serif; fill: #D4D4D4; }
      .label { font: 650 17px Inter, Geist, Arial, sans-serif; fill: #F6F6F6; }
      .detail { font: 400 13px Inter, Geist, Arial, sans-serif; fill: #D4D4D4; }
      .type { font: 700 11px Inter, Geist, Arial, sans-serif; fill: #181818; letter-spacing: 0.7px; }
      .gate { font: 750 19px Inter, Geist, Arial, sans-serif; fill: #181818; }
      .gate-detail { font: 550 12px Inter, Geist, Arial, sans-serif; fill: #2A2A2A; }
      .connector { stroke: #28F89A; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="588" rx="24" fill="#2A2A2A" stroke="#424242" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="588" rx="24" fill="url(#grid)" opacity="0.72"/>

  <text x="50" y="53" class="heading">FROM CHANGE TO E2E GATE</text>
  <text x="50" y="80" class="subtitle">The repository owns policy and topology; the action supplies the portable execution engine</text>

  <g filter="url(#shadow)">
    <rect x="50" y="132" width="190" height="90" rx="15" fill="#333333" stroke="#D4D4D4" stroke-width="1.5"/>
    <rect x="70" y="150" width="58" height="22" rx="11" fill="#28F89A"/>
    <text x="82" y="165" class="type">INPUT</text>
    <text x="70" y="200" class="label">Change opened</text>
  </g>
  <path d="M240 177 H292" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="294" y="116" width="244" height="122" rx="15" fill="#333333" stroke="#28F89A" stroke-width="1.5"/>
    <rect x="314" y="136" width="128" height="22" rx="11" fill="#28F89A"/>
    <text x="328" y="151" class="type">REPO POLICY</text>
    <text x="314" y="190" class="label">Repository workflow</text>
    <text x="314" y="214" class="detail">trigger · permission · concurrency</text>
  </g>
  <path d="M538 177 H590" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="592" y="116" width="244" height="122" rx="15" fill="#22332F" stroke="#28F89A" stroke-width="2"/>
    <rect x="612" y="136" width="132" height="22" rx="11" fill="#28F89A"/>
    <text x="626" y="151" class="type">E2E ENGINE</text>
    <text x="612" y="190" class="label">Portable action</text>
    <text x="612" y="214" class="detail">codotech/playwright-e2e@v0</text>
  </g>

  <path d="M680 238 V276 H485 V314" class="connector"/>
  <path d="M748 238 V276 H773 V314" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="362" y="316" width="246" height="110" rx="15" fill="#333333" stroke="#424242" stroke-width="1.5"/>
    <text x="386" y="352" class="label">Dockerized SUT</text>
    <text x="386" y="378" class="detail">build · health · service graph</text>
    <text x="386" y="400" class="detail">owned by the application</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="650" y="316" width="246" height="110" rx="15" fill="#333333" stroke="#424242" stroke-width="1.5"/>
    <text x="674" y="352" class="label">Playwright runner</text>
    <text x="674" y="378" class="detail">projects · tags · workers</text>
    <text x="674" y="400" class="detail">reused by content hash</text>
  </g>

  <path d="M485 426 V464 H626" class="connector"/>
  <path d="M773 426 V464 H704" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="544" y="450" width="242" height="88" rx="15" fill="#333333" stroke="#28F89A" stroke-width="1.5"/>
    <text x="568" y="484" class="label">Results + report</text>
    <text x="568" y="510" class="detail">traces · logs · portable images</text>
  </g>

  <path d="M786 494 H934" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="936" y="440" width="214" height="108" rx="18" fill="#28F89A" stroke="#23E18B" stroke-width="2"/>
    <text x="993" y="485" class="gate">E2E Gate</text>
    <text x="978" y="512" class="gate-detail">required before merge</text>
  </g>

  <text x="50" y="560" class="subtitle">Replace the example SUT and tests; keep the same action contract.</text>
</svg>
