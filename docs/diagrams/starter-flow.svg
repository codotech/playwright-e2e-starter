<svg width="1200" height="590" viewBox="0 0 1200 590" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Starter repository E2E flow</title>
  <desc id="description">The repository workflow chooses either a caller-started system or an existing remote environment. Both provide a ready base URL to codotech/playwright-e2e@v0, which runs Playwright and publishes reports. The caller enforces the E2E gate and owns any service startup, logs, and cleanup.</desc>
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#353535" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#28F89A"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#181818" flood-opacity="0.32"/>
    </filter>
    <style>
      .heading { font: 700 22px Inter, Geist, Arial, sans-serif; letter-spacing: 1.8px; fill: #28F89A; }
      .subtitle { font: 400 15px Inter, Geist, Arial, sans-serif; fill: #D4D4D4; }
      .label { font: 650 17px Inter, Geist, Arial, sans-serif; fill: #F6F6F6; }
      .detail { font: 400 13px Inter, Geist, Arial, sans-serif; fill: #D4D4D4; }
      .type { font: 700 11px Inter, Geist, Arial, sans-serif; fill: #181818; letter-spacing: 0.7px; }
      .gate { font: 750 19px Inter, Geist, Arial, sans-serif; fill: #181818; }
      .gate-detail { font: 550 12px Inter, Geist, Arial, sans-serif; fill: #2A2A2A; }
      .connector { stroke: #28F89A; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="588" rx="24" fill="#2A2A2A" stroke="#424242" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="588" rx="24" fill="url(#grid)" opacity="0.72"/>

  <text x="50" y="53" class="heading">FROM READY TARGET TO E2E GATE</text>
  <text x="50" y="80" class="subtitle">On a change, the repository workflow chooses the target; the action owns tests and reports</text>

  <g filter="url(#shadow)">
    <rect x="50" y="150" width="280" height="130" rx="15" fill="#333333" stroke="#D4D4D4" stroke-width="1.5"/>
    <rect x="70" y="168" width="144" height="22" rx="11" fill="#28F89A"/>
    <text x="82" y="183" class="type">CALLER-STARTED</text>
    <text x="70" y="222" class="label">Local system</text>
    <text x="70" y="248" class="detail">Compose or your own startup steps</text>
    <text x="70" y="267" class="detail">Caller waits until ready</text>
  </g>

  <text x="179" y="312" class="subtitle">OR</text>

  <g filter="url(#shadow)">
    <rect x="50" y="340" width="280" height="130" rx="15" fill="#333333" stroke="#D4D4D4" stroke-width="1.5"/>
    <rect x="70" y="358" width="144" height="22" rx="11" fill="#28F89A"/>
    <text x="82" y="373" class="type">ALREADY RUNNING</text>
    <text x="70" y="412" class="label">Remote environment</text>
    <text x="70" y="438" class="detail">Staging or another reachable target</text>
    <text x="70" y="457" class="detail">No service startup in this workflow</text>
  </g>

  <path d="M330 215 H380 V310 H428" class="connector"/>
  <path d="M330 405 H380 V310" stroke="#28F89A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="430" y="250" width="210" height="120" rx="15" fill="#333333" stroke="#28F89A" stroke-width="1.5"/>
    <text x="454" y="289" class="label">Ready base URL</text>
    <text x="454" y="318" class="detail">sut.baseUrl in e2e/ci.yml</text>
    <text x="454" y="345" class="detail">Reachable by the runner</text>
  </g>

  <path d="M640 310 H748" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="750" y="230" width="400" height="140" rx="15" fill="#22332F" stroke="#28F89A" stroke-width="2"/>
    <rect x="774" y="250" width="132" height="22" rx="11" fill="#28F89A"/>
    <text x="788" y="265" class="type">E2E ENGINE</text>
    <text x="774" y="307" class="label">codotech/playwright-e2e@v0</text>
    <text x="774" y="334" class="detail">Playwright runner · projects · tags · workers</text>
    <text x="774" y="353" class="detail">No application startup or teardown</text>
  </g>

  <path d="M855 370 V428" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="750" y="430" width="210" height="88" rx="15" fill="#333333" stroke="#28F89A" stroke-width="1.5"/>
    <text x="770" y="464" class="label">Results + report</text>
    <text x="770" y="490" class="detail">traces · portable images</text>
  </g>

  <path d="M960 474 H998" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="1000" y="430" width="150" height="88" rx="18" fill="#28F89A" stroke="#23E18B" stroke-width="2"/>
    <text x="1030" y="464" class="gate">E2E Gate</text>
    <text x="1018" y="490" class="gate-detail">Caller enforces result</text>
  </g>

  <text x="50" y="560" class="subtitle">For caller-started services, the caller also collects logs and cleans up. The action only receives their URL.</text>
</svg>
